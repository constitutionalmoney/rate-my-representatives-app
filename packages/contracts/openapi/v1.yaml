components:
  securitySchemes:
    SessionBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
      description: Opaque authenticated human session; never accepted from query parameters.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque caller-generated retry key; must contain no location or account data.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{7,127}$'
    PreferenceId:
      name: preferenceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    ProfileId:
      name: profileId
      in: path
      required: true
      description: Stable application profile identifier for one person and one public-role context.
      schema: { $ref: '#/components/schemas/OpaqueId' }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Entity tag from a prior read of this profile version.
      schema: { type: string, maxLength: 200 }
    PublicRoleAsOf:
      name: asOf
      in: query
      required: false
      description: Effective timestamp; defaults to the deterministic synthetic fixture timestamp.
      schema: { type: string, format: date-time }
    PublicRoleCountryCode:
      name: countryCode
      in: query
      required: false
      schema: { type: string, enum: [CA, US] }
    PublicRoleIncludeHistorical:
      name: includeHistorical
      in: query
      required: false
      schema: { type: boolean, default: false }
  headers:
    CacheControl:
      description: Explicit response cache policy.
      schema:
        type: string
    CorrelationId:
      description: Safe opaque correlation reference; never an account or identity identifier.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$'
    ETag:
      description: Weak entity tag derived from the reviewed public profile record version.
      schema:
        type: string
        pattern: '^W/"[a-zA-Z0-9._:-]+"$'
    RetryAfter:
      description: Seconds before a safe retry may be attempted.
      schema:
        type: integer
        minimum: 0
  schemas:
    OpaqueId:
      type: string
      pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$'
    ApiError:
      $ref: ../schemas/api-error.schema.json
    CivicSignalBriefing:
      $ref: ../schemas/civic-signal-briefing.schema.json
    HealthStatus:
      $ref: ../schemas/health-status.schema.json
    JurisdictionRegistry:
      $ref: ../schemas/jurisdiction-registry.schema.json
    MobileCompatibilityStatus:
      $ref: ../schemas/mobile-compatibility-status.schema.json
    PublicRoleRegistry:
      $ref: ../schemas/public-role-registry.schema.json
    PublicRoleProfile:
      $ref: ../schemas/public-role-profile.schema.json
    PublicRoleProfileList:
      $ref: ../schemas/public-role-profile-list.schema.json
    PublicRoleProfileTimeline:
      $ref: ../schemas/public-role-profile-timeline.schema.json
    RepresentativeSignalCommand:
      $ref: ../schemas/representative-signal-command.schema.json
    RepresentationAmbiguitySelection:
      $ref: ../schemas/representation-ambiguity-selection.schema.json
    RepresentationCapabilities:
      $ref: ../schemas/representation-capabilities.schema.json
    RepresentationResolutionRequest:
      $ref: ../schemas/representation-resolution-request.schema.json
    RepresentationResolution:
      $ref: ../schemas/representation-resolution.schema.json
    SavedBroadJurisdiction:
      $ref: ../schemas/saved-broad-jurisdiction.schema.json
    BroadJurisdictionPreferenceCommand:
      type: object
      additionalProperties: false
      required: [schemaVersion, countryCode, jurisdictionId]
      properties:
        schemaVersion: { const: broad-jurisdiction-preference-command.v1 }
        countryCode: { type: string, enum: [CA, US] }
        jurisdictionId: { $ref: '#/components/schemas/OpaqueId' }
  responses:
    ValidationError:
      description: The request is invalid. Error details never echo precise input.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthenticated:
      description: A valid human session is required.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: The requested record does not exist or is not visible to this actor.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: The idempotency key or optimistic state conflicts with an existing write.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PublicProfileNotFound:
      description: The profile does not exist or has no human-approved publication decision.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    FeatureDisabled:
      description: The capability is disabled or still proposed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            proposedJurisdictions:
              $ref: '#/components/examples/SyntheticJurisdictionsProposed'
  examples:
    SyntheticRepresentationCapabilities:
      summary: Synthetic Canada and United States location-provider capabilities
      externalValue: ../fixtures/representation-capabilities.synthetic.json
    SyntheticCanadianRepresentationResolution:
      summary: Synthetic effective-dated Canadian representation result
      externalValue: ../fixtures/representation-resolution-ca.synthetic.json
    SyntheticSavedBroadJurisdiction:
      summary: Synthetic province-level account preference
      externalValue: ../fixtures/saved-broad-jurisdiction.synthetic.json
    SyntheticPublicRoleProfile:
      summary: Synthetic source-backed public-role profile
      externalValue: ../fixtures/public-role-profile.synthetic.json
    SyntheticHealthReady:
      summary: Synthetic contract-foundation health
      value:
        status: ready
        service: api
        version: 1.0.0-contract
        contract:
          currentVersion: v1
          minimumSupportedVersion: v1
          supportedVersions: [v1]
        featureStates:
          publicRegistry: operational
          civicSignal: disabled
          representativeSignals: disabled
          verus: disabled
          provenanceWrites: disabled
        optionalDependencies:
          verus: disabled
        dataMode: synthetic
    SyntheticJurisdictionRegistry:
      summary: Synthetic Canada and United States registry slice
      externalValue: ../fixtures/jurisdictions.synthetic.json
    SyntheticJurisdictionsProposed:
      summary: Synthetic proposed-state response
      value:
        schemaVersion: api-error.v1
        code: FEATURE_DISABLED
        message: This capability is not operational.
        correlationId: synthetic-correlation-jurisdictions
        fieldErrors: []
        retryable: false
        retryAfterSeconds: null
        featureState: proposed
        dependencyState: null
    SyntheticMobileCompatibilityReady:
      summary: Synthetic native-client compatibility policy
      value:
        status: compatible
        contract:
          currentVersion: v1
          minimumSupportedVersion: v1
          supportedVersions: [v1]
        platforms:
          ios:
            releaseState: foundation
            minimumAppVersion: 0.1.0
            minimumBuildNumber: 1
            supportedContractVersions: [v1]
          android:
            releaseState: foundation
            minimumAppVersion: 0.1.0
            minimumBuildNumber: 1
            supportedContractVersions: [v1]
    SyntheticPublicRoleRegistry:
      summary: Synthetic public-role lifecycle fixture
      externalValue: ../fixtures/public-role-registry.synthetic.json
