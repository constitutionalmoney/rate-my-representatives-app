openapi: 3.1.0
info:
  title: Rate My Representatives API
  version: 1.0.0-contract
  summary: Versioned mobile-first public-accountability API contract
  description: >-
    Canonical v1 contract foundation. Health, mobile compatibility, the synthetic
    effective-dated jurisdiction registry, public-role lifecycle reads, and reviewed
    source-backed public profiles are operational. Every other route family is contract
    discovery only and has no operation.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:3000
    description: Synthetic local development
    x-rmr-feature-status: operational
  - url: https://api.ratemyrepresentatives.com
    description: Proposed production origin; no production API is claimed live
    x-rmr-feature-status: proposed
tags:
  - name: Health
    description: Operational contract-foundation health only; expanded readiness belongs to issue #42.
  - name: Jurisdictions
    description: Operational synthetic nested jurisdiction, district, body, and office registry.
  - name: Representation
    description: Proposed representation resolution.
  - name: People
    description: Operational synthetic public people and reviewed resolution history.
  - name: Offices
    description: Proposed public office registry.
  - name: Office terms
    description: Operational synthetic office-term lifecycle registry.
  - name: Elections
    description: Operational synthetic election registry.
  - name: Candidacies
    description: Operational synthetic candidacy lifecycle registry.
  - name: Profiles
    description: Operational reviewed, allowlisted, source-backed public-role profiles.
  - name: Sources
    description: Proposed official-source contracts.
  - name: Claims
    description: Proposed source-backed factual claims.
  - name: Coverage
    description: Proposed source coverage and freshness.
  - name: Methodologies
    description: Proposed versioned methodology publication.
  - name: Authentication
    description: Disabled public authentication routes.
  - name: Account
    description: Disabled private account routes.
  - name: Representative claims
    description: Disabled representative authority claim routes.
  - name: Staff delegations
    description: Disabled authorized-staff delegation routes.
  - name: Representative signals
    description: Disabled, human-only representative signal routes; distinct from Civic Signal.
  - name: Category ratings
    description: Disabled human category-rating routes.
  - name: Community context
    description: Disabled human community-context routes.
  - name: Evidence
    description: Disabled evidence submission routes.
  - name: Responses
    description: Disabled official response routes.
  - name: Disputes
    description: Proposed dispute routes.
  - name: Corrections
    description: Proposed correction routes.
  - name: Appeals
    description: Proposed appeal routes.
  - name: Civic Signal
    description: Disabled monitoring and briefing routes; never a human representative signal.
  - name: Notifications
    description: Disabled notification routes.
  - name: Verus
    description: Disabled optional VRSCTEST-first Verus integration routes; no arbitrary RPC.
  - name: Provenance
    description: Disabled public provenance reads and writes; no chain writer is implemented.
paths:
  /api/v1/health:
    get:
      operationId: getApiHealth
      summary: Read the API contract-foundation status
      description: >-
        Reports that the implemented contract slice can respond. This is not the
        database/dependency readiness family owned by issue #42.
      tags: [Health]
      deprecated: false
      security: []
      x-rmr-contract:
        featureStatus: operational
        allowedActors: [anonymous, human, representative, staff, reviewer, admin, service, agent]
        requiredScopes: []
        authentication: none
        recentPresence: false
        privacyClassification: public
        fieldPrivacy: all-response-fields-public
        publicSerializer: health-status-v1
        privateSerializer: not-applicable
        idempotency: not-applicable
        concurrency: none
        rateLimitClass: public-health
        errorCodes: []
        auditEffect: none
        outboxEffect: none
        pagination: none
        filters: none
        sort: none
        cache: no-store
        versionPolicy: additive-v1
        sourceMetadata: none
      responses:
        '200':
          description: The API contract foundation is available.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                syntheticReady:
                  $ref: '#/components/examples/SyntheticHealthReady'
  /api/v1/health/mobile:
    get:
      operationId: getMobileCompatibility
      summary: Read installed native-client compatibility policy
      description: >-
        Reports minimum app versions/builds and supported contract versions for native
        iOS and Android clients. The current response is synthetic and does not claim an
        app-store release.
      tags: [Health]
      deprecated: false
      security: []
      x-rmr-contract:
        featureStatus: operational
        allowedActors: [anonymous, human, representative, staff, reviewer, admin, service, agent]
        requiredScopes: []
        authentication: none
        recentPresence: false
        privacyClassification: public
        fieldPrivacy: all-response-fields-public
        publicSerializer: mobile-compatibility-status-v1
        privateSerializer: not-applicable
        idempotency: not-applicable
        concurrency: none
        rateLimitClass: public-health
        errorCodes: []
        auditEffect: none
        outboxEffect: none
        pagination: none
        filters: none
        sort: none
        cache: no-store
        versionPolicy: additive-v1
        sourceMetadata: release-policy-foundation
      responses:
        '200':
          description: Native client contract compatibility policy.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileCompatibilityStatus'
              examples:
                syntheticCompatible:
                  $ref: '#/components/examples/SyntheticMobileCompatibilityReady'
  /api/v1/jurisdictions:
    get:
      operationId: getJurisdictionAvailability
      summary: Read the effective-dated synthetic jurisdiction registry
      description: >-
        Returns the nested Canada/United States synthetic registry at an effective
        date. It is not an eligibility, citizenship, legal-residence, or precise
        location determination. Person, term, candidacy, ingestion, and location
        resolution families remain explicitly deferred.
      tags: [Jurisdictions]
      deprecated: false
      security: []
      parameters:
        - name: asOf
          in: query
          required: false
          description: Effective-date timestamp; defaults to the deterministic fixture timestamp.
          schema:
            type: string
            format: date-time
        - name: countryCode
          in: query
          required: false
          description: Restrict the graph to a synthetic country fixture.
          schema:
            type: string
            enum: [CA, US]
        - name: jurisdictionId
          in: query
          required: false
          description: Restrict the result to the connected effective-dated jurisdiction graph.
          schema:
            type: string
            pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$'
        - name: includeHistorical
          in: query
          required: false
          description: Include superseded and historical versions instead of only the as-of slice.
          schema:
            type: boolean
            default: false
      x-rmr-contract:
        featureStatus: operational
        allowedActors: [anonymous, human, representative, staff, reviewer, admin, service, agent]
        requiredScopes: []
        authentication: none
        recentPresence: false
        privacyClassification: public
        fieldPrivacy: all-response-fields-public
        publicSerializer: jurisdiction-registry-v1
        privateSerializer: not-applicable
        idempotency: not-applicable
        concurrency: none
        rateLimitClass: public-read
        errorCodes: [VALIDATION_ERROR, FEATURE_DISABLED, MAINTENANCE]
        auditEffect: none
        outboxEffect: none
        pagination: terminal-cursor
        filters: [asOf, countryCode, jurisdictionId, includeHistorical]
        sort: stable-id
        cache: no-store
        versionPolicy: additive-v1
        sourceMetadata: synthetic-attribution-per-record
      responses:
        '200':
          description: Effective-dated synthetic registry read model.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionRegistry'
              examples:
                syntheticRegistry:
                  $ref: '#/components/examples/SyntheticJurisdictionRegistry'
        '400':
          description: One or more effective-date or filter parameters are invalid.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/FeatureDisabled'
  /api/v1/representation:
    description: Proposed; no operation until the representation-resolution issue is implemented.
    x-rmr-feature-status: proposed
  /api/v1/people:
    get:
      operationId: getPeopleRegistry
      summary: Read public people and reviewed person-resolution history
      tags: [People]
      deprecated: false
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicRoleAsOf'
        - $ref: '#/components/parameters/PublicRoleCountryCode'
        - $ref: '#/components/parameters/PublicRoleIncludeHistorical'
        - name: personId
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OpaqueId' }
      x-rmr-contract: &publicRoleReadContract
        featureStatus: operational
        allowedActors: [anonymous, human, representative, staff, reviewer, admin, service, agent]
        requiredScopes: []
        authentication: none
        recentPresence: false
        privacyClassification: public
        fieldPrivacy: public-fields-only
        publicSerializer: public-role-registry-v1
        privateSerializer: not-applicable
        idempotency: not-applicable
        concurrency: none
        rateLimitClass: public-read
        errorCodes: [VALIDATION_ERROR, FEATURE_DISABLED, MAINTENANCE]
        auditEffect: none
        outboxEffect: none
        pagination: terminal-cursor
        filters: [asOf, countryCode, includeHistorical, entityId]
        sort: stable-id
        cache: no-store
        versionPolicy: additive-v1
        sourceMetadata: synthetic-attribution-per-record
      responses: &publicRoleReadResponses
        '200':
          description: Synthetic public-role lifecycle read model.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicRoleRegistry' }
              examples:
                syntheticPublicRoles: { $ref: '#/components/examples/SyntheticPublicRoleRegistry' }
        '400':
          description: One or more query parameters are invalid.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/offices:
    description: Structural offices remain operational through the nested /api/v1/jurisdictions graph; no duplicate office operation is added.
    x-rmr-feature-status: proposed
  /api/v1/office-terms:
    get:
      operationId: getOfficeTermRegistry
      summary: Read effective office-term lifecycle records
      tags: [Office terms]
      deprecated: false
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicRoleAsOf'
        - $ref: '#/components/parameters/PublicRoleCountryCode'
        - $ref: '#/components/parameters/PublicRoleIncludeHistorical'
        - name: officeTermId
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OpaqueId' }
      x-rmr-contract: *publicRoleReadContract
      responses: *publicRoleReadResponses
  /api/v1/elections:
    get:
      operationId: getElectionRegistry
      summary: Read effective election records
      tags: [Elections]
      deprecated: false
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicRoleAsOf'
        - $ref: '#/components/parameters/PublicRoleCountryCode'
        - $ref: '#/components/parameters/PublicRoleIncludeHistorical'
        - name: electionId
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OpaqueId' }
      x-rmr-contract: *publicRoleReadContract
      responses: *publicRoleReadResponses
  /api/v1/candidacies:
    get:
      operationId: getCandidacyRegistry
      summary: Read source-attributed candidacy lifecycle records
      description: A won candidacy is not an office term and never creates one through this read operation.
      tags: [Candidacies]
      deprecated: false
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicRoleAsOf'
        - $ref: '#/components/parameters/PublicRoleCountryCode'
        - $ref: '#/components/parameters/PublicRoleIncludeHistorical'
        - name: candidacyId
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OpaqueId' }
      x-rmr-contract: *publicRoleReadContract
      responses: *publicRoleReadResponses
  /api/v1/profiles:
    get:
      operationId: listPublicRoleProfiles
      summary: List reviewed source-backed public-role profile summaries
      description: >-
        Returns only profiles with an explicit human publication decision. It never
        includes a composite score, representative-signal aggregate, private account,
        location, attestation, staff-evidence, moderator-note, or wallet data.
      tags: [Profiles]
      deprecated: false
      security: []
      parameters:
        - name: countryCode
          in: query
          required: false
          schema: { type: string, enum: [CA, US] }
        - name: contextKind
          in: query
          required: false
          schema: { type: string, enum: [office_term, candidacy] }
      x-rmr-contract: &publicProfileReadContract
        featureStatus: operational
        allowedActors: [anonymous, human, representative, staff, reviewer, admin, service, agent]
        requiredScopes: []
        authentication: none
        recentPresence: false
        privacyClassification: public
        fieldPrivacy: allowlisted-reviewed-public-fields-only
        publicSerializer: source-backed-public-profile-v1
        privateSerializer: not-applicable
        idempotency: not-applicable
        concurrency: conditional-get-etag
        rateLimitClass: public-read
        errorCodes: [VALIDATION_ERROR, NOT_FOUND, MAINTENANCE]
        auditEffect: none
        outboxEffect: none
        pagination: terminal-cursor
        filters: [countryCode, contextKind]
        sort: stable-profile-id
        cache: public-etag-conditional
        versionPolicy: additive-v1-record-version
        sourceMetadata: reviewed-source-and-freshness-per-material-claim
      responses:
        '200':
          description: Reviewed public profile summaries.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '../schemas/public-role-profile-list.schema.json' }
  /api/v1/profiles/{profileId}:
    get:
      operationId: getPublicRoleProfile
      summary: Read one reviewed source-backed public-role profile
      description: >-
        Returns separate person, office, district, office-term, election, and candidacy
        objects. Optional provenance metadata is absent when provenance is disabled and
        never determines factual truth.
      tags: [Profiles]
      deprecated: false
      security: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/IfNoneMatch'
      x-rmr-contract: *publicProfileReadContract
      responses:
        '200':
          description: Reviewed source-backed public profile.
          headers: &publicProfileHeaders
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '../schemas/public-role-profile.schema.json' }
              examples:
                syntheticProfile: { $ref: '#/components/examples/SyntheticPublicRoleProfile' }
        '304':
          description: The supplied entity tag matches the current reviewed profile version.
          headers: *publicProfileHeaders
        '404': { $ref: '#/components/responses/PublicProfileNotFound' }
  /api/v1/profiles/{profileId}/timeline:
    get:
      operationId: getPublicRoleProfileTimeline
      summary: Read a cursor-paginated visible profile history
      tags: [Profiles]
      deprecated: false
      security: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/IfNoneMatch'
        - name: cursor
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OpaqueId' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                office_term_transition,
                candidacy_transition,
                source_refresh,
                correction,
                response,
                dispute,
                appeal,
              ]
      x-rmr-contract:
        featureStatus: operational
        allowedActors: [anonymous, human, representative, staff, reviewer, admin, service, agent]
        requiredScopes: []
        authentication: none
        recentPresence: false
        privacyClassification: public
        fieldPrivacy: allowlisted-reviewed-public-fields-only
        publicSerializer: source-backed-public-profile-v1
        privateSerializer: not-applicable
        idempotency: not-applicable
        concurrency: conditional-get-etag
        rateLimitClass: public-read
        errorCodes: [VALIDATION_ERROR, NOT_FOUND, MAINTENANCE]
        auditEffect: none
        outboxEffect: none
        pagination: opaque-terminal-cursor
        filters: [kind]
        sort: occurred-at-descending-then-stable-id
        cache: public-etag-conditional
        versionPolicy: additive-v1-record-version
        sourceMetadata: reviewed-source-and-freshness-per-material-claim
      responses:
        '200':
          description: Visible reviewed profile history.
          headers: *publicProfileHeaders
          content:
            application/json:
              schema: { $ref: '../schemas/public-role-profile-timeline.schema.json' }
        '304':
          description: The supplied entity tag matches the current reviewed profile version.
          headers: *publicProfileHeaders
        '400':
          description: Timeline cursor, limit, or filter is invalid.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404': { $ref: '#/components/responses/PublicProfileNotFound' }
  /api/v1/profiles/{profileId}/sources:
    get:
      operationId: getPublicRoleProfileSources
      summary: Read sources and reproducibility metadata for a public profile
      tags: [Profiles, Sources]
      deprecated: false
      security: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/IfNoneMatch'
      x-rmr-contract: *publicProfileReadContract
      responses:
        '200':
          description: Reviewed public source records and freshness state.
          headers: *publicProfileHeaders
          content:
            application/json:
              schema: { $ref: '../schemas/public-role-profile.schema.json#/$defs/sourceSection' }
        '304': { description: Not modified., headers: *publicProfileHeaders }
        '404': { $ref: '#/components/responses/PublicProfileNotFound' }
  /api/v1/profiles/{profileId}/coverage:
    get:
      operationId: getPublicRoleProfileCoverage
      summary: Read explicit profile coverage gaps and source conflicts
      tags: [Profiles, Coverage]
      deprecated: false
      security: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/IfNoneMatch'
      x-rmr-contract: *publicProfileReadContract
      responses:
        '200':
          description: Coverage, gap, freshness, and conflict metadata.
          headers: *publicProfileHeaders
          content:
            application/json:
              schema: { $ref: '../schemas/public-role-profile.schema.json#/$defs/coverageSection' }
        '304': { description: Not modified., headers: *publicProfileHeaders }
        '404': { $ref: '#/components/responses/PublicProfileNotFound' }
  /api/v1/profiles/{profileId}/responses:
    get:
      operationId: getPublicRoleProfileResponses
      summary: Read published representative responses or an explicit availability state
      tags: [Profiles, Responses]
      deprecated: false
      security: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/IfNoneMatch'
      x-rmr-contract: *publicProfileReadContract
      responses:
        '200':
          description: Published responses or an explicit unavailable/unsupported state.
          headers: *publicProfileHeaders
          content:
            application/json:
              schema: { $ref: '../schemas/public-role-profile.schema.json#/$defs/responseSection' }
        '304': { description: Not modified., headers: *publicProfileHeaders }
        '404': { $ref: '#/components/responses/PublicProfileNotFound' }
  /api/v1/profiles/{profileId}/disputes:
    get:
      operationId: getPublicRoleProfileDisputes
      summary: Read visible disputes or an explicit availability state
      tags: [Profiles, Disputes]
      deprecated: false
      security: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/IfNoneMatch'
      x-rmr-contract: *publicProfileReadContract
      responses:
        '200':
          description: Visible disputes or an explicit unavailable/unsupported state.
          headers: *publicProfileHeaders
          content:
            application/json:
              schema: { $ref: '../schemas/public-role-profile.schema.json#/$defs/disputeSection' }
        '304': { description: Not modified., headers: *publicProfileHeaders }
        '404': { $ref: '#/components/responses/PublicProfileNotFound' }
  /api/v1/profiles/{profileId}/corrections:
    get:
      operationId: getPublicRoleProfileCorrections
      summary: Read visible correction and supersession history
      tags: [Profiles, Corrections]
      deprecated: false
      security: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/IfNoneMatch'
      x-rmr-contract: *publicProfileReadContract
      responses:
        '200':
          description: Visible corrections or an explicit unavailable/unsupported state.
          headers: *publicProfileHeaders
          content:
            application/json:
              schema:
                { $ref: '../schemas/public-role-profile.schema.json#/$defs/correctionSection' }
        '304': { description: Not modified., headers: *publicProfileHeaders }
        '404': { $ref: '#/components/responses/PublicProfileNotFound' }
  /api/v1/profiles/{profileId}/appeals:
    get:
      operationId: getPublicRoleProfileAppeals
      summary: Read visible appeal history or an explicit availability state
      tags: [Profiles, Appeals]
      deprecated: false
      security: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/IfNoneMatch'
      x-rmr-contract: *publicProfileReadContract
      responses:
        '200':
          description: Visible appeals or an explicit unavailable/unsupported state.
          headers: *publicProfileHeaders
          content:
            application/json:
              schema: { $ref: '../schemas/public-role-profile.schema.json#/$defs/appealSection' }
        '304': { description: Not modified., headers: *publicProfileHeaders }
        '404': { $ref: '#/components/responses/PublicProfileNotFound' }
  /api/v1/sources:
    description: Profile-scoped public source reads are operational under /api/v1/profiles/{profileId}/sources; no global enumeration operation exists.
    x-rmr-feature-status: proposed
  /api/v1/claims:
    description: Proposed; no source-backed claim operation in this issue.
    x-rmr-feature-status: proposed
  /api/v1/coverage:
    description: Profile-scoped coverage reads are operational under /api/v1/profiles/{profileId}/coverage; no global enumeration operation exists.
    x-rmr-feature-status: proposed
  /api/v1/methodologies:
    description: Proposed; no scoring or methodology result operation in this issue.
    x-rmr-feature-status: proposed
  /api/v1/auth:
    description: Disabled; issue #12 domain policy does not expose public authentication routes.
    x-rmr-feature-status: disabled
  /api/v1/account:
    description: Disabled private account route family.
    x-rmr-feature-status: disabled
  /api/v1/representative-claims:
    description: Disabled representative-claim route family.
    x-rmr-feature-status: disabled
  /api/v1/staff-delegations:
    description: Disabled staff-delegation route family.
    x-rmr-feature-status: disabled
  /api/v1/representative-signals:
    description: Disabled human-intent route family. Skip has no operation and creates no signal.
    x-rmr-feature-status: disabled
    x-rmr-allowed-actors: [human]
    x-rmr-agent-access: forbidden
  /api/v1/category-ratings:
    description: Disabled human-intent category-rating route family.
    x-rmr-feature-status: disabled
    x-rmr-allowed-actors: [human]
    x-rmr-agent-access: forbidden
  /api/v1/community-context:
    description: Disabled human-authored community-context route family.
    x-rmr-feature-status: disabled
    x-rmr-allowed-actors: [human]
    x-rmr-agent-access: forbidden
  /api/v1/evidence:
    description: Disabled evidence route family; no ingestion is implemented.
    x-rmr-feature-status: disabled
  /api/v1/responses:
    description: Disabled official response route family.
    x-rmr-feature-status: disabled
    x-rmr-agent-access: forbidden
  /api/v1/disputes:
    description: Proposed dispute route family.
    x-rmr-feature-status: proposed
  /api/v1/corrections:
    description: Proposed correction route family.
    x-rmr-feature-status: proposed
  /api/v1/appeals:
    description: Proposed appeal route family.
    x-rmr-feature-status: proposed
  /api/v1/civic-signal:
    description: Disabled monitoring/briefing route family; it cannot create human judgment.
    x-rmr-feature-status: disabled
    x-rmr-allowed-actors: [human, service, agent]
    x-rmr-human-intent: forbidden
  /api/v1/notifications:
    description: Disabled notification route family.
    x-rmr-feature-status: disabled
  /api/v1/verus:
    description: Disabled optional Verus route family; no arbitrary RPC, signer, or key operation exists.
    x-rmr-feature-status: disabled
    x-rmr-network: VRSCTEST
  /api/v1/provenance:
    description: Disabled provenance route family; issue #35 owns any future VRSCTEST writer.
    x-rmr-feature-status: disabled
components:
  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      description: Stable application profile identifier for one person and one public-role context.
      schema: { $ref: '#/components/schemas/OpaqueId' }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Entity tag from a prior read of this profile version.
