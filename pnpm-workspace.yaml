packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

# Expo/Metro resolves image-size 1.2.1 only in the build toolchain. These two 2026-08-07
# parser DoS advisories have no patched release. Repository-controlled assets and bounded
# CI timeouts limit exposure; remove both exceptions as soon as upstream ships a fix.
audit:
  level: high
  ignore:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr

overrides:
  js-yaml@4.3.0: 4.3.1

catalog:
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@vitejs/plugin-react': 6.0.5
  react: 19.2.3
  react-dom: 19.2.8
  vite: 8.2.1

onlyBuiltDependencies:
  - esbuild

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.13'
  - '@expo/config-plugins@57.0.7'
  - babel-preset-expo@57.0.6
  - expo-asset@57.0.9
  - expo-file-system@57.0.2
  - expo-modules-core@57.0.10
  - expo@57.0.11
  - vite@8.2.1
